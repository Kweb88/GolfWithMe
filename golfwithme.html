    };
    if($('#epClearPhoto')) $('#epClearPhoto').onclick = () => { if(ui.profileDraft) ui.profileDraft.avatarImage = null; render(); };
    if($('#createProfileBtn')) $('#createProfileBtn').onclick = async () => {
      const name = $('#obName').value.trim(); if(!name) return;
      const btn = $('#createProfileBtn'); if(btn.disabled) return; btn.disabled = true;
      const avatar = (ui.profileDraft && ui.profileDraft.avatar) || '⛳';
      const avatarImage = (ui.profileDraft && ui.profileDraft.avatarImage) || null;
      state.profile = { name, avatar, avatarImage, homeCourse: $('#obCourse').value.trim(), favoriteFormat: $('#obFormat').value, bio: '' };
      await saveProfile();
      ui.profileDraft = null; ui.view = 'feed';
      render();
    };
    if($('#editProfileBtn')) $('#editProfileBtn').onclick = () => { ui.editingProfile = true; ui.profileDraft = {...state.profile}; render(); };
    if($('#cancelEditProfile')) $('#cancelEditProfile').onclick = () => { ui.editingProfile = false; ui.profileDraft = null; render(); };
    if($('#saveProfileBtn')) $('#saveProfileBtn').onclick = async () => {
      const name = $('#epName').value.trim(); if(!name) return;
      const btn = $('#saveProfileBtn'); if(btn.disabled) return; btn.disabled = true;
      state.profile = { name, avatar: (ui.profileDraft&&ui.profileDraft.avatar)||state.profile.avatar, avatarImage: (ui.profileDraft&&('avatarImage' in ui.profileDraft))?ui.profileDraft.avatarImage:(state.profile.avatarImage||null), homeCourse: $('#epCourse').value.trim(), favoriteFormat: $('#epFormat').value, bio: $('#epBio').value.trim() };
      await saveProfile();
      ui.editingProfile = false; ui.profileDraft = null;
      render();
    };

    // ----- Feed -----
    if($('#postUpdateBtn')) $('#postUpdateBtn').onclick = async () => {
      const btn = $('#postUpdateBtn'); if(btn.disabled) return;
      const text = $('#composerText').value.trim(); if(!text) return;
      const codeSel = $('#composerTrip') || $('#composerTripSingle');
      const code = codeSel ? codeSel.value : null;
      const t = code ? state.trips[code] : null;
      if(!t) return;
      btn.disabled = true;
      pushFeed(t, 'post', text, ui.composerPhoto);
      await saveTrip(t);
      ui.composerPhoto = null;
      render();
    };
    $$('[data-like-post]').forEach(el => el.onclick = async () => {
      const [code, id] = el.dataset.likePost.split(':');
      const t = state.trips[code]; if(!t) return;
      const post = (t.feed||[]).find(f => f.id === id); if(!post) return;
      post.likedBy = post.likedBy || [];
      const name = state.profile.name;
      if(post.likedBy.includes(name)) post.likedBy = post.likedBy.filter(n=>n!==name); else post.likedBy.push(name);
      await saveTrip(t); render();
    });
    $$('[data-open-post-trip]').forEach(el => el.onclick = (e) => {
      if(e.target.closest('[data-like-post]')) return;
      const code = el.dataset.openPostTrip;
      state.currentCode = code; ui.view='trip'; ui.tripTab='players'; render(); startPolling();
    });

    // ----- Trips -----
    $$('[data-open-trip]').forEach(el => el.onclick = async () => { const code = el.dataset.openTrip; await fetchTrip(code); state.currentCode = code; ui.view='trip'; ui.tripTab='players'; ui.roundId=null; render(); startPolling(); });
    $$('[data-remove-trip]').forEach(el => el.onclick = (e) => { e.stopPropagation(); ui.pendingRemoveCode = el.dataset.removeTrip; ui.modal = 'removeTrip'; render(); });
    if($('#confirmRemoveTripBtn')) $('#confirmRemoveTripBtn').onclick = async () => {
      state.myTrips = state.myTrips.filter(m => m.code !== ui.pendingRemoveCode);
      await saveMyTrips(); ui.modal = null; ui.pendingRemoveCode = null; render();
    };
    if($('#confirmDeleteBtn')) $('#confirmDeleteBtn').onclick = async () => {
      const d = ui.pendingDelete; if(!d || !trip){ ui.modal=null; render(); return; }
      if(d.type === 'player') trip.players = trip.players.filter(p => p.id !== d.id);
      else if(d.type === 'round'){ trip.rounds = trip.rounds.filter(r => r.id !== d.id); if(ui.roundId===d.id) ui.roundId=null; }
      else if(d.type === 'expense') trip.expenses = trip.expenses.filter(ex => ex.id !== d.id);
      else if(d.type === 'lodging') trip.lodging = trip.lodging.filter(l => l.id !== d.id);
      await saveTrip(trip);
      ui.modal = null; ui.pendingDelete = null; render();
    };

    if($('#createTripBtn')) $('#createTripBtn').onclick = async () => {
      const name = $('#mTripName').value.trim(); if(!name) return;
      $('#createTripBtn').disabled = true; $('#createTripBtn').textContent = 'Creating…';
      const code = await uniqueCode();
      const newTrip = { code, name, location: $('#mTripLoc').value.trim(), startDate: $('#mTripStart').value, endDate: $('#mTripEnd').value, players: [], rounds: [], expenses: [], lodging: [], teams: null, feed: [], public: false };
      if(state.profile) newTrip.players.push({ id: uid(), name: state.profile.name, venmo:'', cashapp:'', zelle:'' });
      pushFeed(newTrip, 'created', `${state.profile ? state.profile.name : 'Someone'} started the trip 🏌️`);
      await saveTrip(newTrip);
      state.myTrips.push({ code, name }); await saveMyTrips();
      state.currentCode = code; ui.view='trip'; ui.tripTab='players'; ui.modal=null;
      render(); startPolling();
    };
    if($('#doJoinBtn')) $('#doJoinBtn').onclick = async () => {
      const raw = $('#mJoinCode').value.trim().toUpperCase(); if(!raw){ ui.joinErr='Enter a code.'; render(); return; }
      $('#doJoinBtn').disabled = true; $('#doJoinBtn').textContent = 'Looking up…';
      const t = await fetchTrip(raw);
      if(!t){ ui.joinErr = `No trip found for code "${raw}".`; render(); return; }
      if(!state.myTrips.find(m => m.code === raw)){ state.myTrips.push({ code: raw, name: t.name }); await saveMyTrips(); }
      state.currentCode = raw; ui.view='trip'; ui.tripTab='players'; ui.modal=null; ui.joinErr='';
      render(); startPolling();
    };

    if($('#addMeBtn')) $('#addMeBtn').onclick = async () => {
      const btn = $('#addMeBtn'); if(btn.disabled) return; btn.disabled = true;
      trip.players.push({ id: uid(), name: state.profile.name, venmo:'', cashapp:'', zelle:'' });
      pushFeed(trip, 'join', `${state.profile.name} joined the trip`);
      await saveTrip(trip); render();
    };
    if($('#addPlayerBtn')) $('#addPlayerBtn').onclick = async () => {
      const btn = $('#addPlayerBtn'); if(btn.disabled) return;
      const name = $('#npName').value.trim(); if(!name) return;
      btn.disabled = true;
      trip.players.push({ id: uid(), name, venmo: $('#npVenmo').value.trim(), cashapp: $('#npCashapp').value.trim().replace(/^\$/, ''), zelle: $('#npZelle').value.trim() });
      pushFeed(trip, 'join', `${name} joined the trip`);
      await saveTrip(trip); render();
    };
    $$('[data-remove-player]').forEach(el => el.onclick = () => {
      const p = trip.players.find(pl => pl.id === el.dataset.removePlayer);
      ui.pendingDelete = { type:'player', id: el.dataset.removePlayer, label: p ? p.name : 'this player' };
      ui.modal = 'confirmDelete'; render();
    });

    $$('[data-trip-tab]').forEach(el => el.onclick = () => { ui.tripTab = el.dataset.tripTab; render(); });

    if($('#newRoundBtn')) $('#newRoundBtn').onclick = () => { ui.courseQuery=''; ui.selectedCourse=null; ui.newRoundFormat='stroke'; ui.modal='newRound'; render(); };
    if($('#mFormat')) $('#mFormat').onchange = (e) => { ui.newRoundFormat = e.target.value; render(); };
    if($('#mCourseSearch')) $('#mCourseSearch').oninput = (e) => { ui.courseQuery = e.target.value; render(); const el=app.querySelector('#mCourseSearch'); if(el){ el.focus(); el.selectionStart=el.selectionEnd=el.value.length; } };
    $$('[data-pick-course]').forEach(el => el.onclick = () => { ui.selectedCourse = JSON.parse(el.dataset.pickCourse); ui.courseQuery=''; render(); });
    if(app.querySelector('[data-clear-course]')) app.querySelector('[data-clear-course]').onclick = () => { ui.selectedCourse = null; render(); };

    if($('#createRoundBtn')) $('#createRoundBtn').onclick = async () => {
      const btn = $('#createRoundBtn'); if(btn.disabled) return;
      const format = ($('#mFormat') && $('#mFormat').value) || 'stroke';
      const course = $('#mCourse').value.trim();
      if(!course) return;
      btn.disabled = true;
      const defaultPar = [4,4,3,5,4,4,3,5,4,4,4,3,5,4,4,3,5,4];
      const newRound = { id: uid(), course, courseLocation: ui.selectedCourse ? `${ui.selectedCourse.city}, ${ui.selectedCourse.region}` : '', date: $('#mRoundDate').value, format, skinsBet:0, nassauBet:0, par: defaultPar, scores: {}, groups: [], matchPlayers: null, ryderPairs: null, comments: [], likedBy: [] };
      trip.players.forEach(p => { newRound.scores[p.id] = new Array(18).fill(''); });
      if(format==='stroke'){
        newRound.skinsBet = Math.max(0, Number(($('#mSkinsBet')&&$('#mSkinsBet').value)||0));
        newRound.nassauBet = Math.max(0, Number(($('#mNassauBet')&&$('#mNassauBet').value)||0));
        const split = $('#mSplitGroups') && $('#mSplitGroups').value === 'yes';
        if(split){
          const chunks = []; for(let i=0;i<trip.players.length;i+=4) chunks.push(trip.players.slice(i,i+4));
          newRound.groups = chunks.map((c,i) => ({ id: uid(), name: `Group ${i+1}`, playerIds: c.map(p=>p.id) }));
        }
      } else if(format==='match'){
        newRound.matchPlayers = [$('#mMatchA').value, $('#mMatchB').value];
      } else if(format==='ryder' && trip.teams){
        const teamA = trip.players.filter(p => trip.teams.teamA.includes(p.id));
        const teamB = trip.players.filter(p => trip.teams.teamB.includes(p.id));
        const n = Math.min(teamA.length, teamB.length);
        const pairs = []; for(let i=0;i<n;i++) pairs.push({ a: teamA[i].id, b: teamB[i].id });
        newRound.ryderPairs = pairs;
      }
      trip.rounds.push(newRound);
      pushFeed(trip, 'round', `New round logged: ${course || 'a course'}${newRound.courseLocation ? ' — '+newRound.courseLocation : ''}`);
      await saveTrip(trip);
      ui.roundId = newRound.id; ui.modal = null; ui.courseQuery=''; ui.selectedCourse=null; ui.groupFilter=null; ui.scorecardView='play'; ui.playHole=0;
      render();
    };
    $$('[data-round]').forEach(el => el.onclick = (e) => { if(e.target.closest('[data-remove-round]')) return; ui.roundId = el.dataset.round; ui.groupFilter=null; ui.playHole=0; render(); });
    $$('[data-remove-round]').forEach(el => el.onclick = (e) => {
      e.stopPropagation();
      const r = trip.rounds.find(rd => rd.id === el.dataset.removeRound);
      ui.pendingDelete = { type:'round', id: el.dataset.removeRound, label: r ? (r.course || 'this round') : 'this round' };
      ui.modal = 'confirmDelete'; render();
    });
    $$('[data-group-filter]').forEach(el => el.onclick = () => { ui.groupFilter = el.dataset.groupFilter; render(); });
    $$('[data-par]').forEach(el => el.onchange = async () => { const round = trip.rounds.find(r=>r.id===ui.roundId); round.par[Number(el.dataset.par)] = Number(el.value)||0; await saveTrip(trip); render(); });
    $$('[data-score-player]').forEach(el => el.onchange = async () => {
      const round = trip.rounds.find(r=>r.id===ui.roundId);
      const pid = el.dataset.scorePlayer, hole = Number(el.dataset.scoreHole);
      if(!round.scores[pid]) round.scores[pid] = new Array(18).fill('');
      round.scores[pid][hole] = el.value === '' ? '' : Number(el.value);
      const wasCelebrating = !!ui.celebrateData;
      maybeCelebrate(trip, round);
      if(ui.celebrateData && !wasCelebrating) pushFeed(trip, 'milestone', ui.celebrateData.title + ' ' + ui.celebrateData.winner);
      await saveTrip(trip);
      render();
    });

    // ----- Play Mode -----
    $$('[data-scorecard-view]').forEach(el => el.onclick = () => { ui.scorecardView = el.dataset.scorecardView; render(); });
    $$('[data-play-score-player]').forEach(el => el.onchange = async () => {
      const round = trip.rounds.find(r=>r.id===ui.roundId); if(!round) return;
      const pid = el.dataset.playScorePlayer, hole = Number(el.dataset.playScoreHole);
      if(!round.scores[pid]) round.scores[pid] = new Array(18).fill('');
      const raw = el.value === '' ? '' : Math.max(1, Math.min(15, Number(el.value)));
      round.scores[pid][hole] = raw;
      const wasCelebrating = !!ui.celebrateData;
      maybeCelebrate(trip, round);
      if(ui.celebrateData && !wasCelebrating) pushFeed(trip, 'milestone', ui.celebrateData.title + ' ' + ui.celebrateData.winner);
      await saveTrip(trip);
      render();
    });
    if($('#playPrevHole')) $('#playPrevHole').onclick = () => { ui.playHole = Math.max(0, (ui.playHole||0)-1); render(); syncNow(); };
    if($('#playNextHole')) $('#playNextHole').onclick = () => { ui.playHole = Math.min(17, (ui.playHole||0)+1); render(); syncNow(); };
    $$('[data-play-jump]').forEach(el => el.onclick = () => { ui.playHole = Number(el.dataset.playJump); render(); syncNow(); });

    // ----- Round comments / reactions -----
    $$('[data-like-round]').forEach(el => el.onclick = async () => {
      const round = trip.rounds.find(r=>r.id===el.dataset.likeRound); if(!round) return;
      round.likedBy = round.likedBy || [];
      const name = state.profile.name;
      if(round.likedBy.includes(name)) round.likedBy = round.likedBy.filter(n=>n!==name); else round.likedBy.push(name);
      await saveTrip(trip); render();
    });
    $$('[data-add-comment]').forEach(el => el.onclick = async () => {
      const roundId = el.dataset.addComment;
      const input = $(`#commentInput-${roundId}`); if(!input) return;
      const text = input.value.trim(); if(!text) return;
      const round = trip.rounds.find(r=>r.id===roundId); if(!round) return;
      round.comments = round.comments || [];
      round.comments.push({ id: uid(), author: state.profile.name, text, ts: Date.now() });
      await saveTrip(trip); render();
    });

    // ----- Ryder Cup -----
    if($('#saveTeamsBtn')) $('#saveTeamsBtn').onclick = async () => {
      const teamAName = $('#teamAName').value.trim() || 'Team A';
      const teamBName = $('#teamBName').value.trim() || 'Team B';
      const teamA = [], teamB = [];
      $$('[data-team-assign]').forEach(sel => { if(sel.value==='A') teamA.push(sel.dataset.teamAssign); else teamB.push(sel.dataset.teamAssign); });
      trip.teams = { teamAName, teamBName, teamA, teamB };
      await saveTrip(trip); render();
    };
    if($('#resetTeamsBtn')) $('#resetTeamsBtn').onclick = async () => { trip.teams = null; await saveTrip(trip); render(); };

    // ----- Expenses -----
    // ----- Course reviews -----
    $$('[data-rate-course]').forEach(el => el.onclick = () => {
      ui.pendingRatings[el.dataset.rateCourse] = Number(el.dataset.rateValue);
      render();
    });
    $$('[data-submit-review]').forEach(el => el.onclick = async () => {
      const roundId = el.dataset.submitReview;
      const round = trip.rounds.find(r => r.id === roundId); if(!round || !round.course) return;
      const rating = ui.pendingRatings[roundId];
      if(!rating){ alert('Tap a star to rate the course first.'); return; }
      const textInput = $(`#reviewText-${roundId}`);
      const text = textInput ? textInput.value.trim() : '';
      const list = state.courseReviews[round.course] || [];
      const existingIdx = list.findIndex(r => r.author === state.profile.name);
      const entry = { author: state.profile.name, rating, text, ts: Date.now() };
      if(existingIdx >= 0) list[existingIdx] = entry; else list.push(entry);
      state.courseReviews[round.course] = list;
      await saveReviews();
      delete ui.pendingRatings[roundId];
      render();
    });

    // ----- Trip Awards / Recap -----
    if($('#addLongestDriveBtn')) $('#addLongestDriveBtn').onclick = async () => {
      const roundId = $('#ldRoundSelect').value, playerId = $('#ldPlayerSelect').value, distance = Number($('#ldDistance').value);
      if(!isFinite(distance) || distance <= 0) return;
      const round = trip.rounds.find(r => r.id === roundId); if(!round) return;
      round.longestDrive = { playerId, distance };
      await saveTrip(trip); render();
    };
    if($('#showRecapBtn')) $('#showRecapBtn').onclick = () => { ui.modal = 'tripRecap'; render(); };
    if($('#copyRecapBtn')) $('#copyRecapBtn').onclick = () => {
      const text = generateRecapText(trip);
      const btn = $('#copyRecapBtn');
      if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => { btn.textContent = 'Copied!'; setTimeout(()=>{ btn.textContent='Copy'; },1500); }).catch(() => { btn.textContent = 'Copy failed'; setTimeout(()=>{ btn.textContent='Copy'; },1500); });
      else { btn.textContent = 'Not supported here'; setTimeout(()=>{ btn.textContent='Copy'; },1500); }
    };
    if($('#postRecapBtn')) $('#postRecapBtn').onclick = async () => {
      const text = generateRecapText(trip);
      pushFeed(trip, 'recap', text);
      await saveTrip(trip);
      ui.modal = null; render();
    };

    if($('#newExpenseBtn')) $('#newExpenseBtn').onclick = () => { expenseChipState = {}; trip.players.forEach(p => expenseChipState[p.id] = true); ui.modal='newExpense'; render(); };
    $$('[data-expense-chip]').forEach(el => el.onclick = () => { const id = el.dataset.expenseChip; expenseChipState[id] = !expenseChipState[id]; el.classList.toggle('selected', expenseChipState[id]); });
    if($('#createExpenseBtn')) $('#createExpenseBtn').onclick = async () => {
      const btn = $('#createExpenseBtn'); if(btn.disabled) return;
      const desc = $('#mExpDesc').value.trim(); const amount = Number($('#mExpAmount').value); const paidBy = $('#mExpPaidBy').value;
      if(!desc || !isFinite(amount) || amount <= 0) return;
      btn.disabled = true;
      trip.expenses.push({ id: uid(), desc, amount, paidBy, splitAmong: Object.keys(expenseChipState).filter(id => expenseChipState[id]) });
      pushFeed(trip, 'expense', `💸 New expense: ${desc} (${fmt(amount)})`);
      await saveTrip(trip); ui.modal = null; render();
    };
    $$('[data-remove-expense]').forEach(el => el.onclick = () => {
      const ex = trip.expenses.find(e => e.id === el.dataset.removeExpense);
      ui.pendingDelete = { type:'expense', id: el.dataset.removeExpense, label: ex ? ex.desc : 'this expense' };
      ui.modal = 'confirmDelete'; render();
    });

    // ----- Lodging -----
    if($('#newLodgingBtn')) $('#newLodgingBtn').onclick = () => { expenseChipState = {}; trip.players.forEach(p => expenseChipState[p.id] = true); ui.modal='newLodging'; render(); };
    $$('[data-lodging-chip]').forEach(el => el.onclick = () => { const id = el.dataset.lodgingChip; expenseChipState[id] = !expenseChipState[id]; el.classList.toggle('selected', expenseChipState[id]); });
    if($('#createLodgingBtn')) $('#createLodgingBtn').onclick = async () => {
      const btn = $('#createLodgingBtn'); if(btn.disabled) return;
      const name = $('#mLodgeName').value.trim(); const cost = Number($('#mLodgeCost').value); const paidBy = $('#mLodgePaidBy').value;
      if(!name || !isFinite(cost) || cost <= 0) return;
      btn.disabled = true;
      trip.lodging.push({ id: uid(), name, address: $('#mLodgeAddr').value.trim(), checkin: $('#mLodgeIn').value, checkout: $('#mLodgeOut').value, cost, confirmation: $('#mLodgeConf').value.trim(), paidBy, splitAmong: Object.keys(expenseChipState).filter(id => expenseChipState[id]) });
      pushFeed(trip, 'lodging', `🏠 Lodging booked: ${name}`);
      await saveTrip(trip); ui.modal = null; render();
    };
    $$('[data-remove-lodging]').forEach(el => el.onclick = () => {
      const l = trip.lodging.find(lo => lo.id === el.dataset.removeLodging);
      ui.pendingDelete = { type:'lodging', id: el.dataset.removeLodging, label: l ? l.name : 'this lodging entry' };
      ui.modal = 'confirmDelete'; render();
    });

    // ----- Trip settings (public toggle) -----
    if($('#publicToggle')) $('#publicToggle').onclick = async () => {
      await setTripPublic(trip, !trip.public);
      render();
    };
    if($('#seekingToggle')) $('#seekingToggle').onclick = async () => {
      trip.seekingPlayers = trip.seekingPlayers || { active:false, spotsNeeded:1, note:'' };
      trip.seekingPlayers.active = !trip.seekingPlayers.active;
      await saveTrip(trip);
      if(trip.public) await syncRegistryEntry(trip);
      render();
    };
    if($('#saveSeekingBtn')) $('#saveSeekingBtn').onclick = async () => {
      trip.seekingPlayers.spotsNeeded = Math.max(1, Number($('#spotsNeeded').value)||1);
      trip.seekingPlayers.note = $('#seekingNote').value.trim();
      await saveTrip(trip);
      if(trip.public) await syncRegistryEntry(trip);
      render();
    };

    $$('[data-copy-zelle]').forEach(el => el.onclick = () => {
      const text = el.dataset.copyZelle;
      const done = () => { el.textContent = 'Copied!'; setTimeout(()=>{ el.textContent='Copy Zelle Note'; }, 1500); };
      if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(() => { el.textContent = 'Copy failed — select manually'; setTimeout(()=>{ el.textContent='Copy Zelle Note'; }, 2000); });
      else { el.textContent = 'Copy not supported here'; setTimeout(()=>{ el.textContent='Copy Zelle Note'; }, 2000); }
    });
  }

  function startPolling(){
    if(ui.pollTimer) clearInterval(ui.pollTimer);
    ui.pollTimer = setInterval(async () => {
      if(!state.currentCode || ui.modal || ui.celebrateData) return;
      const active = document.activeElement;
      const isTyping = active && app.contains(active) && (active.tagName === 'INPUT' || active.tagName === 'SELECT' || active.tagName === 'TEXTAREA');
      if(isTyping) return;
      const before = JSON.stringify(state.trips[state.currentCode]);
      const fresh = await fetchTrip(state.currentCode);
      if(fresh && JSON.stringify(fresh) !== before) render();
    }, 3000);
  }
  async function syncNow(){
    if(!state.currentCode || ui.modal || ui.celebrateData) return;
    const before = JSON.stringify(state.trips[state.currentCode]);
    const fresh = await fetchTrip(state.currentCode);
    if(fresh && JSON.stringify(fresh) !== before) render();
  }

  function hideLoadingScreen(){
    const el = document.getElementById('gl-loading');
    if(el){ el.classList.add('gl-loading-hidden'); setTimeout(() => { el.remove(); }, 550); }
  }

  async function boot(){
    const minDisplay = new Promise(resolve => setTimeout(resolve, 1600));
    await loadProfile();
    await loadMyTrips();
    await loadRegistry();
    await loadReviews();
    if(state.myTrips.length) await Promise.all(state.myTrips.map(m => fetchTrip(m.code)));
    ui.view = state.profile ? (state.myTrips.length ? 'feed' : 'trips') : 'feed';
    render();
    if(state.currentCode) startPolling();
    await minDisplay;
    hideLoadingScreen();
  }
  boot();
})();
</script>
